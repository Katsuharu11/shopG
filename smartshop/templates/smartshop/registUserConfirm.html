{% load static %}
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=UTF-8' />
		<title>会員登録の確認</title>
		<link rel='stylesheet' type='text/css' href='{% static "insta/css/style.css" %}' />
	</head>
	<body>
        <div class="content">
			<h3>以下の情報で登録しますか？</h3>

			<table>
				<tr>
					<td>会員ID</td>
					<td>{{ new_user.user_id }}</td>
				</tr>
			
				<tr>
					<td>パスワード</td>
					<td>{{ new_user.password }}</td>
				</tr>
			
				<tr>
					<td>お名前</td>
					<td>{{ new_user.name }}</td>
					
				</tr>
			
				<tr>
					<td>ご住所</td>
					<td>{{ new_user.address }}</td>
				</tr>
				<tr>
					<td colspan="2">
						<form action="{% url 'smartshop:registerUserCommit'%}" method='POST'>
							<input type="hidden" name="user_id" value="{{ new_user.user_id }}">
							<input type="hidden" name="password" value="{{ new_user.password }}">
							<input type="hidden" name="name" value="{{ new_user.name }}">
							<input type="hidden" name="address" value="{{ new_user.address }}">
							<input type="submit" value="登録" />
						</form>				
					</td>
				</tr>
			
			</table>

        </div>
        <a href="{% url 'smartshop:search' %}">商品検索へ</a><br>
	</body>
</html>
