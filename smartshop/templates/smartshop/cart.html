{% load static %}
<!DOCTYPE html>
<html>

<head>
    <meta http-equiv='Content-Type' content='text/html; charset=UTF-8' />
    <title>検索結果</title>
    <link rel='stylesheet' type='text/css' href='{% static "insta/css/style.css" %}' />
</head>

<body>
    <h2>sショッピングカート内の商品一覧</h2>

    <table>
		<tr>
			<td>商品名</td>
			<td>商品の色</td>
			<td>メーカー名</td>
            <td>単価</td>
            <td>数量</td>
		</tr>

        {% if items %}
        {% for item in items %}
        <tr>
            <td>{{ item.name }}</td>
            <td>{{ item.color }}</td>
            <td>{{ item.manufacturer }}</td>
            <td>{{ item.price }}</td>
            <td>{{ item.price }}</td>
        </tr>
        {% endfor %}
    {% else %}
        <tr>
            <td colspan="4">条件に合うものは見つかりませんでした。</td>
        </tr>
    {% endif %}    
	</table>
   
   
        <a href="{% url 'smartshop:search' %}">商品検索へ</a><br>

</body>

</html>
